[package]
name = "tunecenter"
version = "0.39.3"
edition = "2021"
authors = ["Atimaniac"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Atimaniac/tune-center"
description = "Tune Center: karta graficzna (Nvidia, AMD), wentylatory, czujniki i pobor mocy w jednym oknie (Windows)"

[dependencies]
# Renderer glow (OpenGL), jak do wersji 0.29; bez wgpu (domyślnego od 0.30).
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "accesskit",
    "default_fonts",
    "clipboard",
    "links",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Direct3D 12: root signature i potoki przy kompilacji shaderów z góry.
windows = { version = "0.62", features = [
    "Win32_Devices_Communication",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
oozextract = "0.5.7"

# Wbudowuje ikone w plik .exe (widoczna w Eksploratorze i na skrotach).
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["webp", "png", "ico", "bmp"] }
