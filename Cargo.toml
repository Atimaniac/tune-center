[package]
name = "tunecenter"
version = "0.29.0"
edition = "2021"
description = "Tune Center: karta graficzna (Nvidia, AMD), wentylatory, czujniki i pobor mocy w jednym oknie (Windows)"

[dependencies]
# Renderer glow (OpenGL), jak do wersji 0.29; bez wgpu (domyślnego od 0.30).
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "accesskit",
    "default_fonts",
    "clipboard",
    "links",
] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Systemowe okna "Zapisz jako" / "Otwórz" do eksportu i importu profili.
rfd = "0.15"
# Rozpakowywanie zrzutów shaderów Dagor Engine (zstd ze słownikiem).
zstd = "0.13"
lz4_flex = "0.11"
# Port szeregowy taśmy LED Skydimo (CH340, protokół Adalight).
serialport = { version = "4", default-features = false }
# Urządzenia RGB na USB HID (Logitech, ASUS Aura, Gigabyte, Corsair, MSI).
hidapi = "2"
# Direct3D 12: root signature i potoki przy kompilacji shaderów z góry.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
oozextract = "0.5.7"

# Ikona w zasobniku systemowym (tylko Windows).
[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"

# Wbudowuje ikone w plik .exe (widoczna w Eksploratorze i na skrotach).
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["webp", "png", "ico", "bmp"] }
